<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>Mi comida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="nav">
  <button data-nav="hoy">Hoy</button>
  <button data-nav="semana">Semana</button>
  <button data-nav="ajustes">Ajustes</button>
</nav>

<dialog id="dlg">
  <form id="addForm" method="dialog">
    <div class="dlg-head"><h2>Añadir</h2><button type="button" id="dlgClose" aria-label="Cerrar" class="icon">✕</button></div>
    <div class="seg" id="seg">
      <button type="button" data-mode="prod">Productos</button>
      <button type="button" data-mode="new">Nuevo</button>
      <button type="button" data-mode="ia">Comida (IA)</button>
    </div>

    <!-- 1. Mis productos -->
    <section id="m-prod">
      <label for="pSearch">Buscar en mis productos</label>
      <input id="pSearch" type="text" autocomplete="off" placeholder="Ej.: yogur, pan, pollo">
      <div id="pList"></div>
    </section>

    <!-- 2. Nuevo producto: catálogo de Mercadona, código de barras o foto de la etiqueta -->
    <section id="m-new" hidden>
      <label for="mSearch">Buscar en Mercadona</label>
      <input id="mSearch" type="text" autocomplete="off" placeholder="Ej.: leche semi, yogur griego">
      <p id="mMsg" class="hint"></p>
      <div id="mList"></div>
      <label for="nCode">Código de barras</label>
      <div class="row">
        <input id="nCode" type="text" inputmode="numeric" autocomplete="off" placeholder="8 a 13 cifras" style="flex:1">
        <button type="button" id="btnScan" class="btn">Escanear</button>
      </div>
      <video id="scanVideo" playsinline muted hidden></video>
      <div class="row" style="margin-top:10px">
        <button type="button" id="btnLookup" class="btn">Buscar por código</button>
        <label class="btn ghost" for="nPhoto" style="margin:0">Foto o imagen de la etiqueta</label>
        <input id="nPhoto" type="file" accept="image/*" hidden>
      </div>
      <p id="newMsg" class="hint"></p>
      <label for="nName">Nombre</label>
      <input id="nName" type="text" autocomplete="off">
      <label for="nUnit">Peso de una unidad o ración, en g (opcional)</label>
      <input id="nUnit" type="number" inputmode="decimal" min="0" step="any">
      <button type="button" id="btnReadLabel" class="btn" style="margin-top:10px" hidden>Leer información nutricional</button>
      <p class="mut" style="margin:10px 0 0">Valores por 100 g, como en la etiqueta</p>
      <div class="grid4">
        <div><label for="nKcal">kcal</label><input id="nKcal" type="number" inputmode="decimal" min="0" step="any"></div>
        <div><label for="nP">Prot. g</label><input id="nP" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
        <div><label for="nC">Carb. g</label><input id="nC" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
        <div><label for="nF">Grasa g</label><input id="nF" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
      </div>
      <button type="button" id="btnSaveProd" class="btn primary big">Guardar producto y elegir cantidad</button>
    </section>

    <!-- 3. Comida casera o de restaurante: estimación con IA -->
    <section id="m-ia" hidden>
      <label for="fText">Describe lo que has comido, con cantidades</label>
      <input id="fText" type="text" placeholder="Ej.: 2 rebanadas de pan integral y 80 g de pollo" autocomplete="off">
      <div class="row" style="margin-top:10px">
        <label class="btn ghost" for="fPhoto" style="margin:0">Foto o imagen</label>
        <input id="fPhoto" type="file" accept="image/*" hidden>
        <button type="button" id="btnEst" class="btn">Estimar con IA</button>
      </div>
      <p id="estMsg" class="hint"></p>
      <label for="fName">Nombre</label>
      <input id="fName" type="text">
      <div class="grid4">
        <div><label for="fKcal">kcal</label><input id="fKcal" type="number" inputmode="decimal" min="0" step="any"></div>
        <div><label for="fP">Prot. g</label><input id="fP" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
        <div><label for="fC">Carb. g</label><input id="fC" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
        <div><label for="fF">Grasa g</label><input id="fF" type="number" inputmode="decimal" min="0" step="any" value="0"></div>
      </div>
    </section>

    <!-- Cantidad de un producto guardado -->
    <section id="m-qty" hidden>
      <h2 id="qName" style="margin-top:12px"></h2>
      <p id="qInfo" class="mut" style="margin:2px 0 0"></p>
      <div class="two">
        <div><label for="qG">Cantidad (g)</label><input id="qG" type="number" inputmode="decimal" min="0" step="any"></div>
        <div id="qUwrap"><label for="qU">Unidades</label><input id="qU" type="number" inputmode="decimal" min="0" step="any"></div>
      </div>
      <p id="qCalc" class="ok" style="margin:12px 0 0"></p>
      <button type="button" id="btnDelProd" class="btn ghost" style="margin-top:8px">Borrar este producto de mi lista</button>
    </section>

    <div id="common" hidden>
      <label for="fMeal">Momento</label>
      <select id="fMeal">
        <option>Desayuno</option><option>Comida</option><option>Cena</option><option>Entre horas</option>
      </select>
      <label class="extra" for="fExtra"><input id="fExtra" type="checkbox"> Es un extra (fuera de dieta)</label>
      <button type="submit" class="btn primary big">Guardar</button>
    </div>
  </form>
</dialog>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
