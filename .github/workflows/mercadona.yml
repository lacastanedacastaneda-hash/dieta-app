# Actualiza el catálogo de Mercadona (datos/mercadona.json) cada jueves por la noche.
# También se puede lanzar a mano: pestaña Actions > Catálogo Mercadona > Run workflow.
name: Catálogo Mercadona

on:
  schedule:
    - cron: '0 21 * * 4' # jueves 21:00 UTC (22:00 o 23:00 en España)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercadona
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar catálogo
        run: node scripts/mercadona.mjs
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/mercadona.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Catálogo Mercadona $(date -u +%F)"
          git pull --rebase
          git push
