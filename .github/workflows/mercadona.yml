# Catálogo de Mercadona (datos/mercadona.json).
# - Jueves por la noche: precios del catálogo + datos nutricionales.
# - Cada día a las 09:00 UTC: datos nutricionales que falten (poco a poco, según la cuota gratuita de la IA).
# También se puede lanzar a mano: pestaña Actions > Catálogo Mercadona > Run workflow (hace las dos cosas).
name: Catálogo Mercadona

on:
  schedule:
    - cron: '0 21 * * 4' # jueves 21:00 UTC (22:00 o 23:00 en España): catálogo y nutrición
    # Cada día 09:00 UTC (10:00 en España en invierno, 11:00 en verano): solo nutrición. Después del reinicio de la
    # cuota gratuita de Gemini (medianoche del Pacífico = 08:00 UTC en invierno, 07:00 en verano).
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercadona
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar catálogo
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * 4'
        run: node scripts/mercadona.mjs
      - name: Datos nutricionales
        # Si falla, no impide guardar el catálogo.
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/nutricion.mjs --minutos 150
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/mercadona.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos Mercadona $(date -u +%F)"
          git pull --rebase
          git push
